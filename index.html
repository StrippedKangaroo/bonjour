<style>

.app{max-width:560px;margin:0 auto;padding-block:14px 120px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}

.stats{display:flex;gap:16px}
.stat{text-align:right}.stat b{display:block;font:600 18px/1.1 var(--sans);font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
h2{font:400 28px/1.1 var(--serif);margin:0}
h3{font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:24px 0 6px}
p{margin:0 0 10px;text-wrap:pretty}

.pron{font:14px/1.4 var(--mono);color:var(--rose);margin:2px 0 8px}
.rv{cursor:pointer;color:var(--mut);border-radius:6px;display:inline-block;padding:0 4px;margin-left:-4px}

.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px;margin:6px 0 12px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--mut);font:600 14px/1 var(--sans);padding:10px 4px;border-radius:9px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.task span{min-width:0}
.task.on span{color:var(--mut);text-decoration:line-through}
.w{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.w .grow{flex:1;min-width:0}
.w .rv{flex:none;max-width:45%;text-align:right;overflow-wrap:anywhere}
.play{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--acc);background:transparent;color:var(--acc);display:grid;place-items:center;cursor:pointer;padding:0}
.play svg{width:16px;height:16px;fill:currentColor}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px}

.ok{color:var(--ok);font-weight:600}.bad{color:var(--rose);font-weight:600}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabin{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mut);font:600 11px/1.2 var(--sans);padding:6px 0;min-height:50px;cursor:pointer}
.tab.on{color:var(--acc)}.tab.on.lv{color:var(--rose)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{background:var(--rose);color:var(--on-rose);border-radius:9px;font-size:10px;padding:0 5px;margin-left:3px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;z-index:9}
.phase{padding:12px 0;border-top:1px solid var(--line)}
.phase b{font-weight:600}
.phase.now{background:var(--soft);margin:0 -10px;padding:12px 10px;border-radius:10px;border-top-color:transparent}
.lvl{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rose);margin-left:6px}
.sub{font-size:13px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font:400 30px/1 var(--serif)}.kpi span{font-size:12px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
</style>
</head>

function readLines(){var i=Math.min(V.vd==null?curDay():V.vd,curDay()),dd=dayData(i),a=[];dd.les.d.forEach(function(l){a.push(sp(l))});a.push(dd.phrase);for(var j=1;j<=3&&i-j>=0;j++)a.push(dayData(i-j).phrase);return a}
function vRead(){var ls=readLines(),n=Object.keys(V.said).length,h='<p class="en">Press play, then say the line right after it. Match the rhythm, not only the words. Tap Said it when you have spoken it aloud.</p>'+bar(n/ls.length)+'<div class="sub">'+n+' of '+ls.length+' said</div>';
ls.forEach(function(q,k){h+='<div class="w">'+play(q[0])+'<div class="grow"><div class="fr">'+esc(q[0])+'</div><div>'+rv(q[1])+'</div></div><div class="btns" style="margin:0;flex:none"><button class="btn sm '+(V.said[k]?"":"ghost")+'" data-a="said" data-k="'+k+'">'+(V.said[k]?"Said":"Said it")+'</button></div></div>'});
return h}

/* ---------- Love ---------- */
function vLove(){var cd=curDay(),h='<h2>Love phrases</h2><p class="en" style="margin-top:6px">Everything you have unlocked, newest first. Use tu with her. A new phrase unlocks every day and they get bolder each week.</p>';
for(var i=cd;i>=0;i--){var dd=dayData(i),p=dd.phrase;h+='<div class="w" style="align-items:flex-start">'+play(p[0])+'<div class="grow"><div class="eyebrow">Day '+(i+1)+'<span class="lvl">'+lvl(dd.w)+'</span></div><div class="fr">'+esc(p[0])+'</div>'+(p[2]?'<div class="pron">'+esc(p[2])+'</div>':'')+'<div>'+rv(p[1])+'</div><div class="btns"><button class="btn ghost sm love" data-a="slow" data-t="'+esc(p[0])+'">Slow</button><button class="btn ghost sm love" data-a="copy" data-t="'+esc(p[0])+'">Copy</button></div></div></div>'}
if(cd<N-1)h+='<p class="sub" style="margin-top:12px">Next unlock tomorrow, level: '+lvl(dayData(cd+1).w)+'.</p>';
return h}

/* ---------- Plan ---------- */
function vPlan(){var cd=curDay(),tot=0,dn=0;for(var i=0;i<=cd;i++){tot+=tasks(i).length;dn+=cnt(i)}
var kn=Object.keys(S.srs).filter(function(k){return S.srs[k].b>=3}).length,h='<h2>Your plan</h2>';
h+='<div class="grid2" style="margin-top:12px"><div class="kpi"><b>'+(dayNum()<0?0:Math.min(dayNum()+1,N))+'<span style="display:inline;font:13px var(--sans)"> / '+N+'</span></b><span>days into Phase 1</span></div><div class="kpi"><b>'+streak()+'</b><span>day streak</span></div><div class="kpi"><b>'+(tot?Math.round(dn/tot*100):0)+'%</b><span>tasks done so far</span></div><div class="kpi"><b>'+kn+'</b><span>well-known cards</span></div></div>';
h+='<h3>Roadmap to Monte Cristo</h3>';
PH.forEach(function(p){h+='<div class="phase '+(p.app?"now":"")+'"><b>'+esc(p.n)+'</b> <span class="sub">'+esc(p.m)+'</span><div class="sub">'+esc(p.l)+'</div><div>'+esc(p.g)+'</div>'+(p.app?'<div class="sub"><b>In this app now.</b> Daily plan, cards, practice and love phrases.</div>':'<div class="sub">Ask Claude to add this phase to the app when you get close.</div>')+'</div>'});
h+='<h3>Checkpoints</h3>';
CP.forEach(function(c){h+='<label class="task '+(S.cp[c.id]?"on":"")+'"><input type="checkbox" data-a="cp" data-k="'+c.id+'"'+(S.cp[c.id]?" checked":"")+'><span><b>Month '+c.m+':</b> '+esc(c.t)+'<br><span class="sub">Pass mark: '+esc(c.p)+'</span></span></label>'});
h+='<h3>The goal sentence</h3><div class="card"><p class="en">The first sentence of the novel. Hear it now, and come back at month 14 to read it unaided.</p><div class="fr">'+esc(GOAL.f)+'</div><div class="btns">'+hear(GOAL.f)+'</div><div style="margin-top:8px">'+rv(GOAL.e)+'</div>';
GOAL.g.forEach(function(g){var q=sp(g);h+='<div class="w">'+play(q[0])+'<div class="grow"><div class="fr">'+esc(q[0])+'</div></div><span class="en" style="max-width:50%;text-align:right">'+esc(q[1])+'</span></div>'});
h+='</div><h3>Settings</h3><label class="eyebrow" for="startd">Day 1 is</label><input type="date" id="startd" value="'+esc(S.start)+'" style="margin:6px 0 14px">';
h+='<div class="eyebrow">Voice speed</div>'+seg([["0.9","Normal"],["0.75","Slower"]],String(S.rate),"rate");
h+='<label class="eyebrow" for="voice">French voice</label>'+(VO.length?'<select id="voice" style="margin:6px 0 14px"><option value="">Automatic</option>'+VO.map(function(v){return '<option value="'+esc(v.name)+'"'+(S.voice===v.name?" selected":"")+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>'}).join("")+'</select>':'<p class="note">No French voice found. On iPhone go to Settings, Accessibility, Spoken Content, Voices, French, and download one. Then reopen this page.</p>');
h+='<h3>Save and backup</h3><p class="'+(STATUS==="cloud"?"ok":"en")+'">'+(STATUS==="cloud"?"Progress is saved to your Claude account.":"Progress is saved on this device only.")+'</p><p class="sub">A Home Screen icon on iPhone keeps storage separate from Safari, so copy a backup before you switch between them.</p>';
h+='<div class="btns"><button class="btn ghost sm" data-a="bk">Copy backup</button></div><textarea id="imp" placeholder="Paste a backup here to restore it" style="margin-top:10px"></textarea><div class="btns"><button class="btn ghost sm" data-a="rs">Restore backup</button><button class="btn ghost sm" data-a="reset">'+(V.cr?"Tap again to erase everything":"Reset progress")+'</button></div>';
return h}

/* ---------- render ---------- */
var ICON={today:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',cards:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="12" rx="2.5"/><path d="M7 4h12a2 2 0 0 1 2 2v9"/></svg>',practice:'<svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',love:'<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.4-9.4A5.2 5.2 0 0 1 12 6.6a5.2 5.2 0 0 1 9.4 4.5C19.5 15.900 12 20.500 12 20.500z"/></svg>',plan:'<svg viewBox="0 0 24 24"><path d="M5 21V4M5 5h12l-2.500 4L17 13H5"/></svg>'};
function drawTabs(){var n=dueCount(),items=[["today","Today"],["cards","Cards"],["practice","Practice"],["love","Love"],["plan","Plan"]];
document.getElementById("tabs").innerHTML=items.map(function(x){return '<button class="tab '+(V.tab===x[0]?"on":"")+(x[0]==="love"?" lv":"")+'" data-a="tab" data-v="'+x[0]+'"'+(V.tab===x[0]?' aria-current="page"':'')+'>'+ICON[x[0]]+'<span>'+x[1]+(x[0]==="cards"&&n?'<span class="badge">'+n+'</span>':'')+'</span></button>'}).join("")}
function render(){var f={today:vToday,cards:vCards,practice:vPractice,love:vLove,plan:vPlan};document.getElementById("view").innerHTML=f[V.tab]();drawTabs();document.getElementById("sDay").textContent=Math.max(1,Math.min(dayNum()+1,N));document.getElementById("sStreak").textContent=streak()}

/* ---------- actions ---------- */
function act(a,el){var d=el.dataset,cd=curDay();
switch(a){
case "tab":V.tab=d.v;V.Q=null;V.L=null;V.T=null;V.said={};V.cr=false;render();window.scrollTo(0,0);break;
case "say":say(d.t,false);break;
case "slow":say(d.t,true);break;
case "copy":copy(d.t);break;
case "rev":el.classList.toggle("hide");break;
case "hint":S.hint=1;persist();render();break;
case "prev":V.vd=Math.max(0,(V.vd==null?cd:V.vd)-1);V.said={};render();window.scrollTo(0,0);break;
case "next":V.vd=Math.min(cd,(V.vd==null?cd:V.vd)+1);V.said={};render();window.scrollTo(0,0);break;
case "todayd":V.vd=null;V.said={};render();window.scrollTo(0,0);break;
case "cm":S.cm=d.v;persist();V.show=false;render();break;
case "show":V.show=true;render();if(S.cm==="en"&&V.Q[0])say(V.Q[0].f);break;
case "again":case "good":{var c=V.Q[0],n=dnum(),r=S.srs[c.f]||{b:0,d:n};if(a==="good"){r.b=Math.min(r.b+1,7);r.d=n+IV[r.b-1]}else{r.b=0;r.d=n}S.srs[c.f]=r;V.Q.shift();if(a==="again")V.Q.push(c);V.show=false;persist();if(!V.Q.length&&V.total>0)auto("cards");render();if(S.cm==="au"&&V.Q[0])say(V.Q[0].f);break}
case "pm":V.pm=d.v;V.said={};render();break;
case "lt-check":{var L=V.L,c2=L.l[L.i],v=document.getElementById("ans").value,ok=nm(v)===nm(c2.f);if(ok)L.s++;L.a={ok:ok,v:v};render();break}
case "lt-next":{var L2=V.L;L2.i++;L2.a=null;if(L2.i>=L2.l.length){S.lt.push({d:iso(new Date()),s:L2.s,n:L2.l.length});S.lt=S.lt.slice(-30);persist();auto("listen")}render();if(L2.l[L2.i])say(L2.l[L2.i].f);break}
case "lt-again":V.L=null;render();break;
case "tr-check":{var T=V.T,c3=T.l[T.i],v2=document.getElementById("ans").value,ok2=nm(v2)===nm(c3.f);if(ok2)T.s++;T.a={ok:ok2,v:v2};render();break}
case "tr-next":{var T2=V.T;T2.i++;T2.a=null;if(T2.i>=T2.l.length){S.tr.push({d:iso(new Date()),s:T2.s,n:T2.l.length});S.tr=S.tr.slice(-30);persist();auto("trans")}render();break}
case "tr-again":V.T=null;render();break;
case "said":{var k=d.k;if(!V.said[k]){V.said[k]=1;var di=curDay();S.aloud[di]=(S.aloud[di]||0)+1;if(Object.keys(V.said).length>=Math.min(5,readLines().length)){auto("aloud");auto("lesson")}persist()}render();break}
case "bk":copy(JSON.stringify(S));break;
case "rs":{try{var o=JSON.parse(document.getElementById("imp").value);if(!o||o.v!==1||!o.start)throw 0;S=Object.assign(def(),o);persist();V.Q=null;V.L=null;V.T=null;toast("Backup restored");render()}catch(e){toast("That backup could not be read")}break}
case "reset":if(!V.cr){V.cr=true;render()}else{S=def();S.start=iso(new Date());S.hint=1;V.cr=false;V.vd=null;V.Q=null;V.L=null;V.T=null;persist();toast("Progress erased");render()}break;
case "rate":S.rate=parseFloat(d.v);persist();render();say("Bonjour, je m'appelle Claude.");break;
}}
document.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(!t||t.disabled)return;var a=t.dataset.a;if(a==="task"||a==="cp")return;act(a,t)});
document.addEventListener("keydown",function(e){var t=e.target;if(e.key==="Enter"&&t.id==="ans"){var b=document.querySelector('[data-a="lt-check"],[data-a="tr-check"]');if(b)b.click()}else if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("rv")){e.preventDefault();t.classList.toggle("hide")}});
document.addEventListener("change",function(e){var t=e.target,a=t.dataset&&t.dataset.a;
if(a==="task"){var i=+t.dataset.i;S.done[i]=S.done[i]||{};S.done[i][t.dataset.k]=t.checked?1:0;persist();render()}
else if(a==="cp"){S.cp[t.dataset.k]=t.checked?1:0;persist();render()}
else if(t.id==="startd"&&t.value){S.start=t.value;V.vd=null;DK=null;persist();render()}
else if(t.id==="voice"){S.voice=t.value;persist();say("Bonjour, ça va ?")}
else if(t.id==="win"){var di=+t.dataset.i,w=Math.floor(di/7);S.notes["w"+w]=t.value;S.done[di]=S.done[di]||{};S.done[di].win=t.value.trim()?1:0;persist();render()}});
render();registerSW();
})();
</script>
</body>
